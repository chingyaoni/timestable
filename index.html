<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九乘法大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --macaron-blue: #A8D8EA;
            --macaron-blue-dark: #7DB9D1;
            --macaron-yellow: #FCE38A;
            --macaron-yellow-dark: #E2C76A;
            --macaron-pink: #FFB7B2;
            --macaron-green: #B5EAD7;
            --warm-white: #FFFDF5;
            --text-main: #5C4D4D;
        }

        body {
            font-family: 'Varela Round', 'Noto Sans TC', sans-serif;
            background-color: var(--warm-white);
            color: var(--text-main);
            overflow: hidden; /* 鎖定畫面，防止iPad上下滑動 */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 圓潤氣球按鈕風格 */
        .btn-bubble {
            transition: all 0.15s ease;
            box-shadow: 0 6px 0px rgba(0,0,0,0.1);
            border-radius: 9999px;
            text-align: center;
            cursor: pointer;
        }
        .btn-bubble:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.1);
        }

        /* 數字方塊風格 (選單用) */
        .btn-block {
            transition: all 0.15s ease;
            box-shadow: 0 6px 0px rgba(0,0,0,0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 900;
        }
        .btn-block:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.1);
        }
        
        .bg-m-blue { background-color: var(--macaron-blue); }
        .bg-m-blue:hover { background-color: #92CDD6; }
        .bg-m-yellow { background-color: var(--macaron-yellow); }
        .bg-m-yellow:hover { background-color: #EED372; }
        .bg-m-pink { background-color: var(--macaron-pink); }
        .bg-m-green { background-color: var(--macaron-green); }

        /* 選擇框樣式 */
        .checkbox-custom input:checked + div {
            background-color: var(--macaron-yellow);
            border-color: var(--macaron-yellow-dark);
            transform: scale(1.05);
            box-shadow: 0 6px 0px var(--macaron-yellow-dark);
        }

        /* 動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-2deg); }
            40%, 80% { transform: translateX(8px) rotate(2deg); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .floating-reward {
            position: absolute;
            font-size: 3rem;
            pointer-events: none;
            animation: floatUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 50;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 隱藏元素用 */
        .d-none { display: none !important; }

        /* Numpad specific */
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">

    <!-- 煙火畫布 (置底) -->
    <canvas id="fireworksCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- ================= 畫面 1：主選單 ================= -->
    <div id="screen-menu" class="w-full max-w-4xl p-6 z-10 flex flex-col items-center">
        <h1 class="text-5xl md:text-6xl font-black mb-8 text-center" style="color: var(--macaron-blue-dark); text-shadow: 2px 2px 0px #FFF, 4px 4px 0px var(--macaron-yellow);">
            ✨ 九九乘法大挑戰 ✨
        </h1>

        <!-- 玩法選擇 (選擇題 / 鍵盤) -->
        <div class="flex gap-4 mb-8">
            <button id="toggle-choice" class="btn-bubble bg-m-yellow py-3 px-8 text-2xl font-bold border-4 border-white" onclick="setPlayStyle('choice')">
                🎈 選擇題模式
            </button>
            <button id="toggle-numpad" class="btn-bubble bg-gray-200 py-3 px-8 text-2xl font-bold border-4 border-transparent text-gray-500" onclick="setPlayStyle('numpad')">
                ⌨️ 數字鍵盤
            </button>
        </div>

        <div class="w-full bg-white rounded-3xl p-6 shadow-xl border-4 border-[var(--macaron-blue)]">
            <!-- 模式切換 Tabs -->
            <div class="flex justify-center gap-4 mb-6">
                <button id="tab-single" class="text-2xl font-bold px-6 py-2 rounded-full bg-m-blue text-white shadow-md" onclick="switchTab('single')">單元挑戰</button>
                <button id="tab-mixed" class="text-2xl font-bold px-6 py-2 rounded-full bg-gray-100 text-gray-400" onclick="switchTab('mixed')">綜合大考驗</button>
            </div>

            <!-- 單元挑戰區 -->
            <div id="menu-single" class="grid grid-cols-4 gap-4">
                <!-- 生成 2~9 按鈕 -->
                <script>
                    for(let i=2; i<=9; i++) {
                        document.write(`<button class="btn-block bg-m-blue text-white text-5xl py-6 border-4 border-white" onclick="startGame([${i}])">${i}</button>`);
                    }
                </script>
            </div>

            <!-- 綜合大考驗區 -->
            <div id="menu-mixed" class="d-none flex flex-col items-center">
                <p class="text-xl mb-4 font-bold text-gray-500">請勾選想要挑戰的數字 (可複選)</p>
                <div class="grid grid-cols-4 gap-4 mb-6 w-full">
                    <script>
                        for(let i=2; i<=9; i++) {
                            document.write(`
                                <label class="checkbox-custom relative cursor-pointer">
                                    <input type="checkbox" value="${i}" class="sr-only mixed-checkbox">
                                    <div class="btn-block bg-gray-100 text-gray-400 text-5xl py-4 border-4 border-transparent transition-all">
                                        ${i}
                                    </div>
                                </label>
                            `);
                        }
                    </script>
                </div>
                <button class="btn-bubble bg-m-yellow text-4xl font-bold py-4 px-16 text-white text-shadow-md" onclick="startMixedGame()">
                    🚀 出發挑戰！
                </button>
            </div>
        </div>
    </div>


    <!-- ================= 畫面 2：遊戲進行中 ================= -->
    <div id="screen-game" class="d-none w-full max-w-5xl p-6 z-10 flex flex-col items-center h-full justify-center relative">
        
        <!-- 頂部資訊：返回與進度 -->
        <div class="absolute top-6 left-6 right-6 flex justify-between items-center">
            <button class="btn-bubble bg-m-pink text-white font-bold text-xl py-2 px-6" onclick="showMenu()">
                🏠 回首頁
            </button>
            <div class="bg-white rounded-full px-6 py-2 shadow-md border-2 border-yellow-300 flex items-center gap-2">
                <span class="text-3xl">🏆</span>
                <span id="score-display" class="text-3xl font-black text-yellow-500">0 / 10</span>
            </div>
        </div>

        <!-- 題目顯示區 -->
        <div id="question-container" class="bg-white rounded-3xl p-8 shadow-2xl border-8 border-[var(--macaron-blue)] mb-8 w-full max-w-2xl text-center mt-12">
            <div id="question-text" class="text-8xl md:text-9xl font-black text-gray-700 tracking-wider">
                3 x 4 = ?
            </div>
        </div>

        <!-- 作答區：選擇題模式 -->
        <div id="gameplay-choice" class="grid grid-cols-2 gap-6 w-full max-w-2xl">
            <button class="choice-btn btn-bubble bg-m-blue text-6xl font-bold py-6 text-white"></button>
            <button class="choice-btn btn-bubble bg-m-yellow text-6xl font-bold py-6 text-white"></button>
            <button class="choice-btn btn-bubble bg-m-green text-6xl font-bold py-6 text-white"></button>
            <button class="choice-btn btn-bubble bg-m-pink text-6xl font-bold py-6 text-white"></button>
        </div>

        <!-- 作答區：數字鍵盤模式 -->
        <div id="gameplay-numpad" class="d-none flex gap-8 w-full max-w-3xl justify-center items-center">
            <!-- 鍵盤 -->
            <div class="numpad-grid bg-white p-4 rounded-3xl shadow-lg border-4 border-gray-100">
                <script>
                    const nums = [1,2,3,4,5,6,7,8,9];
                    nums.forEach(n => {
                        document.write(`<button class="btn-block bg-gray-100 text-4xl py-4 w-20 text-gray-700 hover:bg-gray-200" onclick="inputNum(${n})">${n}</button>`);
                    });
                </script>
                <button class="btn-block bg-m-pink text-2xl py-4 w-20 text-white shadow-sm" onclick="clearInput()">清除</button>
                <button class="btn-block bg-gray-100 text-4xl py-4 w-20 text-gray-700 hover:bg-gray-200" onclick="inputNum(0)">0</button>
                <button class="btn-block bg-m-green text-2xl py-4 w-20 text-white shadow-sm" onclick="submitInput()">送出</button>
            </div>
            
            <!-- 輸入顯示框 -->
            <div class="flex flex-col items-center justify-center bg-white rounded-3xl p-6 shadow-xl border-4 border-gray-200 h-full min-w-[200px]">
                <div class="text-2xl font-bold text-gray-400 mb-2">你的答案</div>
                <div id="numpad-display" class="text-7xl font-black text-[var(--macaron-blue-dark)] h-20">?</div>
            </div>
        </div>

    </div>


    <!-- ================= 畫面 3：過關結算 ================= -->
    <div id="screen-win" class="d-none w-full h-full flex flex-col items-center justify-center z-20 absolute top-0 left-0 bg-white bg-opacity-80 backdrop-blur-sm">
        <div class="text-center pop-in">
            <div class="text-[150px] md:text-[200px] leading-none mb-4" style="text-shadow: 0 20px 30px rgba(0,0,0,0.2);">🏆</div>
            <h1 class="text-6xl font-black text-yellow-500 mb-8" style="text-shadow: 2px 2px 0px #FFF, 4px 4px 0px #F9A826;">太棒了！挑戰成功！</h1>
            <button class="btn-bubble bg-m-blue text-white text-4xl font-bold py-6 px-16 border-4 border-white shadow-xl" onclick="showMenu()">
                🔄 再玩一次
            </button>
        </div>
    </div>


    <script>
        // ================= 全域狀態 =================
        let playStyle = 'choice'; // 'choice' 或 'numpad'
        let currentNumbers = []; // 選擇的乘數陣列
        let currentQuestion = { a: 0, b: 0, ans: 0 };
        let score = 0;
        const TARGET_SCORE = 10;
        let numpadInputValue = "";
        
        // DOM Elements
        const screens = {
            menu: document.getElementById('screen-menu'),
            game: document.getElementById('screen-game'),
            win: document.getElementById('screen-win')
        };
        const numpadDisplay = document.getElementById('numpad-display');
        const questionText = document.getElementById('question-text');
        const scoreDisplay = document.getElementById('score-display');
        const choiceBtns = document.querySelectorAll('.choice-btn');

        // ================= 音效引擎 (Web Audio API) =================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 產生基礎音調
        function playTone(frequency, type, duration, volume = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCorrectSound() {
            initAudio();
            // 清脆歡快的「叮咚」
            playTone(659.25, 'sine', 0.15, 0.2); // E5
            setTimeout(() => playTone(880.00, 'sine', 0.3, 0.2), 100); // A5
        }

        function playWrongSound() {
            initAudio();
            // 溫和沉悶的「Boop」
            playTone(250, 'triangle', 0.2, 0.3);
            setTimeout(() => playTone(200, 'triangle', 0.3, 0.3), 150);
        }

        function playWinFanfare() {
            initAudio();
            // 歡樂過關旋律
            const notes = [
                { f: 523.25, d: 0.15, t: 0 },    // C5
                { f: 659.25, d: 0.15, t: 150 },  // E5
                { f: 783.99, d: 0.15, t: 300 },  // G5
                { f: 1046.50, d: 0.4, t: 450 }   // C6
            ];
            notes.forEach(n => {
                setTimeout(() => playTone(n.f, 'square', n.d, 0.15), n.t);
            });
        }

        // ================= UI 互動與切換 =================

        // 監聽第一次點擊來初始化音效(解決瀏覽器自動播放限制)
        document.body.addEventListener('pointerdown', initAudio, { once: true });

        function setPlayStyle(style) {
            playStyle = style;
            const btnChoice = document.getElementById('toggle-choice');
            const btnNumpad = document.getElementById('toggle-numpad');
            
            if (style === 'choice') {
                btnChoice.className = "btn-bubble bg-m-yellow py-3 px-8 text-2xl font-bold border-4 border-white text-gray-700";
                btnNumpad.className = "btn-bubble bg-gray-200 py-3 px-8 text-2xl font-bold border-4 border-transparent text-gray-500";
            } else {
                btnChoice.className = "btn-bubble bg-gray-200 py-3 px-8 text-2xl font-bold border-4 border-transparent text-gray-500";
                btnNumpad.className = "btn-bubble bg-m-yellow py-3 px-8 text-2xl font-bold border-4 border-white text-gray-700";
            }
            initAudio();
        }

        function switchTab(tab) {
            const tabSingle = document.getElementById('tab-single');
            const tabMixed = document.getElementById('tab-mixed');
            const menuSingle = document.getElementById('menu-single');
            const menuMixed = document.getElementById('menu-mixed');

            if (tab === 'single') {
                tabSingle.className = "text-2xl font-bold px-6 py-2 rounded-full bg-m-blue text-white shadow-md";
                tabMixed.className = "text-2xl font-bold px-6 py-2 rounded-full bg-gray-100 text-gray-400";
                menuSingle.classList.remove('d-none');
                menuMixed.classList.add('d-none');
            } else {
                tabMixed.className = "text-2xl font-bold px-6 py-2 rounded-full bg-m-blue text-white shadow-md";
                tabSingle.className = "text-2xl font-bold px-6 py-2 rounded-full bg-gray-100 text-gray-400";
                menuSingle.classList.add('d-none');
                menuMixed.classList.remove('d-none');
            }
            initAudio();
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('d-none'));
            screens[screenName].classList.remove('d-none');
        }

        function showMenu() {
            stopFireworks();
            showScreen('menu');
        }

        // ================= 遊戲核心邏輯 =================

        function startMixedGame() {
            const checkboxes = document.querySelectorAll('.mixed-checkbox:checked');
            const selected = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (selected.length === 0) {
                // 如果沒選，就微微震動提示
                document.getElementById('menu-mixed').classList.add('shake-anim');
                setTimeout(() => document.getElementById('menu-mixed').classList.remove('shake-anim'), 500);
                return;
            }
            startGame(selected);
        }

        function startGame(numbers) {
            initAudio();
            currentNumbers = numbers;
            score = 0;
            updateScoreDisplay();
            
            // 根據設定切換作答介面
            document.getElementById('gameplay-choice').classList.add('d-none');
            document.getElementById('gameplay-numpad').classList.add('d-none');
            if (playStyle === 'choice') {
                document.getElementById('gameplay-choice').classList.remove('d-none');
            } else {
                document.getElementById('gameplay-numpad').classList.remove('d-none');
            }

            showScreen('game');
            generateQuestion();
        }

        function generateQuestion() {
            // 隨機選一個乘數1 (從勾選的陣列中)
            const a = currentNumbers[Math.floor(Math.random() * currentNumbers.length)];
            // 隨機選乘數2 (1~9)
            const b = Math.floor(Math.random() * 9) + 1;
            
            // 偶爾交換 a, b 位置增加變化 (例如 2x3 變成 3x2)
            if (Math.random() > 0.5) {
                currentQuestion = { a: b, b: a, ans: a * b };
            } else {
                currentQuestion = { a: a, b: b, ans: a * b };
            }

            questionText.innerText = `${currentQuestion.a} x ${currentQuestion.b} = ?`;
            
            // 重置輸入區
            if (playStyle === 'choice') {
                generateChoices();
            } else {
                clearInput();
            }
            
            // 移除可能殘留的震動動畫
            questionText.parentElement.classList.remove('shake-anim');
        }

        function generateChoices() {
            const ans = currentQuestion.ans;
            let choices = new Set([ans]);
            
            // 產生 3 個誘答 (合理範圍內的錯誤答案)
            while(choices.size < 4) {
                // 常見錯誤：加減1、乘數加減1的結果
                const offset = Math.floor(Math.random() * 3) + 1;
                const fake1 = ans + offset;
                const fake2 = ans - offset;
                const fake3 = currentQuestion.a * (currentQuestion.b + offset);
                const fake4 = currentQuestion.a * Math.max(1, currentQuestion.b - offset);
                
                const fakes = [fake1, fake2, fake3, fake4].filter(v => v > 0 && v !== ans);
                if (fakes.length > 0) {
                    choices.add(fakes[Math.floor(Math.random() * fakes.length)]);
                } else {
                    choices.add(ans + Math.floor(Math.random() * 10) + 1);
                }
            }

            const choicesArray = Array.from(choices).sort(() => Math.random() - 0.5); // 打亂

            // 綁定事件與文字
            choiceBtns.forEach((btn, index) => {
                btn.innerText = choicesArray[index];
                btn.onclick = () => checkAnswer(choicesArray[index], btn);
            });
        }

        // -- 鍵盤模式特定邏輯 --
        function inputNum(n) {
            initAudio();
            if (numpadInputValue.length < 2) {
                numpadInputValue += n.toString();
                // 如果第一個是0，且只要輸入第二個字，把0去掉
                if(numpadInputValue.length === 2 && numpadInputValue[0] === '0') {
                    numpadInputValue = numpadInputValue[1];
                }
                numpadDisplay.innerText = numpadInputValue;
            }
        }
        function clearInput() {
            initAudio();
            numpadInputValue = "";
            numpadDisplay.innerText = "?";
            document.getElementById('gameplay-numpad').classList.remove('shake-anim');
        }
        function submitInput() {
            if (numpadInputValue === "") return;
            checkAnswer(parseInt(numpadInputValue), document.getElementById('gameplay-numpad'));
        }

        // -- 判定對錯 --
        function checkAnswer(userAns, sourceElement) {
            if (userAns === currentQuestion.ans) {
                // 答對
                playCorrectSound();
                showFloatingReward(sourceElement);
                score++;
                updateScoreDisplay();

                // 稍微延遲後出下一題或結算
                if (score >= TARGET_SCORE) {
                    setTimeout(triggerWin, 600);
                } else {
                    setTimeout(generateQuestion, 500);
                }
            } else {
                // 答錯
                playWrongSound();
                // 加入震動動畫
                sourceElement.classList.add('shake-anim');
                setTimeout(() => sourceElement.classList.remove('shake-anim'), 400);
                
                if (playStyle === 'numpad') {
                    setTimeout(clearInput, 500); // 答錯後自動清除輸入
                }
            }
        }

        function updateScoreDisplay() {
            scoreDisplay.innerText = `${score} / ${TARGET_SCORE}`;
            // 簡單的放大特效
            scoreDisplay.parentElement.classList.add('scale-110');
            setTimeout(() => scoreDisplay.parentElement.classList.remove('scale-110'), 200);
        }

        function showFloatingReward(sourceElement) {
            const emojis = ['⭐', '🌟', '✨', '😊', '🎉'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const floatingDiv = document.createElement('div');
            floatingDiv.className = 'floating-reward';
            floatingDiv.innerText = emoji;
            
            // 計算初始位置
            const rect = sourceElement.getBoundingClientRect();
            floatingDiv.style.left = (rect.left + rect.width / 2 - 24) + 'px';
            floatingDiv.style.top = (rect.top - 20) + 'px';
            
            document.body.appendChild(floatingDiv);
            
            // 動畫結束後移除
            setTimeout(() => {
                if (floatingDiv.parentNode) floatingDiv.parentNode.removeChild(floatingDiv);
            }, 1200);
        }

        // ================= 過關與煙火特效 =================

        function triggerWin() {
            showScreen('win');
            playWinFanfare();
            startFireworks();
        }

        // --- Canvas 煙火系統 ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // 初始化尺寸

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                // 放射狀隨機速度
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015;
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.vy += 0.1; // 重力
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y) {
            const colors = ['#A8D8EA', '#FCE38A', '#FFB7B2', '#B5EAD7', '#FFF'];
            const pCount = 50 + Math.random() * 50;
            for(let i=0; i<pCount; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            // 半透明清除以產生殘影效果
            ctx.fillStyle = 'rgba(255, 253, 245, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 隨機施放新煙火 (3%機率每幀)
            if (Math.random() < 0.05) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.6); // 在畫面上半部施放
                createExplosion(x, y);
            }

            // 更新並繪製所有粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            canvas.style.opacity = '1';
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animateFireworks();
        }

        function stopFireworks() {
            cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            canvas.style.opacity = '0';
        }

    </script>
</body>
</html>
